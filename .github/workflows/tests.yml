name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Enforce coverage gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python scripts/check_coverage.py
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .pytest_cache/coverage.xml
            .pytest_cache/coverage.json
          if-no-files-found: error
